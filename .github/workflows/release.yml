name: Release

# Push a tag such as v1.0.0 to build installers for every platform and attach
# them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux packages
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          ninja-build python3-venv libglib2.0-dev libgcrypt20-dev libfdt-dev libslirp-dev
      # The ESP32 emulator for the Circuit Simulator (a separate GPL program; see esp32-helper/README.md).
      - uses: actions/cache@v5
        if: runner.os == 'Linux'
        with:
          path: /home/runner/qemu-work
          key: qemu-esp32-${{ hashFiles('esp32-helper/ci-build.sh') }}
      - name: ESP32 emulator
        if: runner.os == 'Linux'
        env:
          QEMU_WORK: /home/runner/qemu-work
        # Stop here, before any installer is built, if the emulator or its source is not where they belong.
        run: |
          sh esp32-helper/ci-build.sh src-tauri/resources/esp32 benchtop-esp32-source.tar.xz
          test -x src-tauri/resources/esp32/benchtop-esp32
          test -s benchtop-esp32-source.tar.xz
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Benchtop ${{ github.ref_name }}
          releaseBody: "What is new in this version is in CHANGELOG.md. Installers for Linux, Windows and macOS are below; the command line is described in docs/CLI.md."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: ESP32 emulator source
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" benchtop-esp32-source.tar.xz --clobber
